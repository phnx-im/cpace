[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "Unicode-3.0",
]

[bans]
multiple-versions = "deny"
skip = [
  # curve25519-dalek 4.1.3 is on cpufeatures 0.2 while sha2 0.11 uses 0.3;
  # the crate only does runtime CPU feature detection, so the split is benign.
  { name = "cpufeatures", version = "0.2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
